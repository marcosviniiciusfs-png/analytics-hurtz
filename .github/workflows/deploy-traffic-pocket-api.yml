name: Deploy Traffic Pocket API

on:
  push:
    branches: [main]
    paths:
      - 'Dashboard Meta Ads/**'
      - 'Meta Ads Monitor/**'
      - '.github/workflows/deploy-traffic-pocket-api.yml'
  workflow_dispatch:

concurrency:
  group: traffic-pocket-api-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VPS_HOST: ${{ secrets.TRAFFIC_POCKET_VPS_HOST }}
      VPS_USER: ${{ secrets.TRAFFIC_POCKET_VPS_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.TRAFFIC_POCKET_VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/traffic-pocket-deploy
          chmod 600 ~/.ssh/traffic-pocket-deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Send API source
        run: |
          tar --exclude='.git' --exclude='.env' -C . -czf - 'Dashboard Meta Ads' 'Meta Ads Monitor' |
            ssh -i ~/.ssh/traffic-pocket-deploy -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
              "mkdir -p '/home/$VPS_USER/traffic-pocket' && tar -xzf - -C '/home/$VPS_USER/traffic-pocket'"

      - name: Ensure Traffic Pocket HTTPS route
        run: |
          ssh -i ~/.ssh/traffic-pocket-deploy -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" "
            set -eu
            sudo docker network connect traffic-pocket-supabase_default supabase-caddy 2>/dev/null || true
            if ! sudo grep -qF 'traffic-api.hurtzcompany.com {' /opt/crm-supabase/volumes/proxy/caddy/Caddyfile; then
              printf '%s\\n' '' 'traffic-api.hurtzcompany.com {' '    reverse_proxy traffic-pocket-api:8091' '    header -server' '}' | sudo tee -a /opt/crm-supabase/volumes/proxy/caddy/Caddyfile >/dev/null
              sudo docker exec supabase-caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            fi
          "

      - name: Rebuild only the Traffic Pocket API
        run: |
          ssh -i ~/.ssh/traffic-pocket-deploy -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" "
            set -eu
            sudo docker build -t traffic-pocket-api:production \
              -f \"/home/$VPS_USER/traffic-pocket/Dashboard Meta Ads/Dockerfile.api\" \
              \"/home/$VPS_USER/traffic-pocket\"
            sudo docker rm -f traffic-pocket-api 2>/dev/null || true
            sudo docker run -d --name traffic-pocket-api --restart unless-stopped \
              --network traffic-pocket-supabase_default \
              --env-file /opt/traffic-pocket-supabase/.env \
              --env-file /opt/traffic-pocket-supabase/secrets/campaign-ai.env \
              -v /opt/meta-ads-cli/secrets:/opt/meta-ads-cli/secrets:ro \
              --mount type=volume,src=traffic-pocket-api-data,dst=/var/lib/traffic-pocket \
              -e META_PERSONAL_DATA_DIR=/var/lib/traffic-pocket/personal \
              -e META_QUERY_STATE_DIR=/var/lib/traffic-pocket \
              -e SUPABASE_URL=http://api-gw:8000 \
              -e ANALYTICS_PUBLIC_URL=https://analytics.hurtzcompany.com \
              -p 127.0.0.1:8091:8091 traffic-pocket-api:production
            sleep 2
            sudo docker ps --filter 'name=^/traffic-pocket-api$' --filter status=running --format '{{.Names}}' | grep -qx traffic-pocket-api
            curl -fsS http://127.0.0.1:8091/ >/dev/null
            sudo docker exec supabase-caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
          "
