version: "3.8"

services:
  planka:
    image: ghcr.io/plankanban/planka:2.1.1
    environment:
      BASE_URL: https://tarefas.161-97-148-99.sslip.io
      DATABASE_URL: postgresql://postgres:$${DATABASE_PASSWORD}@planka_postgres/planka
      DATABASE_PASSWORD__FILE: /run/secrets/planka_db_password
      SECRET_KEY__FILE: /run/secrets/planka_secret_key
      TRUST_PROXY: "true"
      DEFAULT_LANGUAGE: pt-BR
      OUTGOING_BLOCKED_HOSTS: localhost,postgres,planka_postgres
    secrets:
      - planka_db_password
      - planka_secret_key
    volumes:
      - planka_data:/app/data
    networks:
      - planka_internal
      - hurtz
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: stop-first
        failure_action: rollback
      labels:
        traefik.enable: "true"
        traefik.http.routers.planka.rule: Host(`tarefas.161-97-148-99.sslip.io`)
        traefik.http.routers.planka.entrypoints: websecure
        traefik.http.routers.planka.tls.certresolver: letsencryptresolver
        traefik.http.services.planka.loadbalancer.server.port: "1337"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: planka
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/planka_db_password
    secrets:
      - planka_db_password
    volumes:
      - planka_db:/var/lib/postgresql/data
    networks:
      - planka_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planka"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  planka_internal:
    driver: overlay
  hurtz:
    external: true

volumes:
  planka_data:
  planka_db:

secrets:
  planka_db_password:
    external: true
  planka_secret_key:
    external: true
